{{/* Современная модель: разметка перенесена из автономной страницы
     static/labs/skin-effect/index.html, классы приведены к общим. */}}
<div class="lab__stage">
    <canvas id="plot" aria-label="График распределения напряжённости поля по толщине пластины"></canvas>
  </div>

  <div class="lab__controls">
    <fieldset>
      <legend>Металлическая пластина</legend>
      <label for="material">Материал</label>
      <select id="material">
        <option value="copper">Медь — σ = 5,6·10⁷ См/м</option>
        <option value="brass">Латунь — σ = 1,45·10⁷ См/м</option>
        <option value="tin">Олово — σ = 8,6·10⁶ См/м</option>
        <option value="steel">Сталь — σ = 8,0·10⁶ См/м</option>
      </select>
      <label for="thickness">
        Толщина <span class="val" id="thicknessVal">5,0</span> мм
      </label>
      <input type="range" id="thickness" min="0.1" max="20" step="0.1" value="5">
    </fieldset>

    <fieldset>
      <legend>Поле</legend>
      <label for="freq">Частота <span class="val" id="freqVal">1 кГц</span></label>
      <input type="range" id="freq" min="0" max="100" step="1" value="40">
      <label for="probe">
        Координата зонда <span class="val" id="probeVal">0,0</span> мм
      </label>
      <input type="range" id="probe" min="0" max="5" step="0.01" value="0">
      <button id="pause" type="button">Пауза</button>
    </fieldset>
  </div>

  <div class="lab__readouts">
    <div class="lab__cell">
      <div class="lab__k">Глубина проникновения Δ</div>
      <div class="lab__v"><span id="rDelta">—</span> <span class="lab__u">мм</span></div>
    </div>
    <div class="lab__cell">
      <div class="lab__k">Поле на зонде</div>
      <div class="lab__v"><span id="rProbe">—</span> <span class="lab__u">мВ/м</span></div>
    </div>
    <div class="lab__cell">
      <div class="lab__k">Толщина в единицах Δ</div>
      <div class="lab__v"><span id="rRatio">—</span> <span class="lab__u">Δ</span></div>
    </div>
    <div class="lab__cell">
      <div class="lab__k">Ослабление за пластиной</div>
      <div class="lab__v"><span id="rAtten">—</span> <span class="lab__u">дБ</span></div>
    </div>
  </div>
